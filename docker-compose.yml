services:
  postgres:
    image: postgres:16-alpine
    container_name: rentatool_postgres
    restart: always
    environment:
      POSTGRES_DB: rentatool_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rentatool_dev_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentatool_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
